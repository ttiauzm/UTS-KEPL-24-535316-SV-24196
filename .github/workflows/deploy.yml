# Deploy: build image backend & frontend lalu push ke GitHub Container Registry (GHCR)
# Hanya jalan di branch main (setelah PR di-merge).
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write # wajib agar GITHUB_TOKEN boleh push image ke GHCR

jobs:
  deploy:
    name: Deploy (build & push image ke GHCR)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      # GHCR mewajibkan nama image huruf kecil semua (nama org/repo bisa berhuruf besar)
      - name: Tentukan nama image
        run: echo "IMAGE_PREFIX=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login ke GHCR (memakai GitHub Secrets)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push image backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-backend:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}-backend:latest

      - name: Build & push image frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          # Secret repo VITE_API_URL (Settings > Secrets and variables > Actions); ada nilai cadangan
          build-args: |
            VITE_API_URL=${{ secrets.VITE_API_URL || 'http://localhost:8000/api' }}
          tags: |
            ${{ env.IMAGE_PREFIX }}-frontend:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}-frontend:latest
