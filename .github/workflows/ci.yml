# CI: dua job yang berjalan paralel -> backend (Laravel) & frontend (Vue)
name: CI

on:
  push:
    branches: [main, dev, "feature/**"]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

jobs:
  backend:
    name: Backend (Laravel test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, pdo_sqlite, sqlite3
          coverage: none

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install dependensi
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Siapkan .env dan APP_KEY
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Jalankan feature test (php artisan test)
        run: php artisan test

  frontend:
    name: Frontend (Vue lint, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependensi
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit test
        run: npm test

      - name: Build
        run: npm run build
        env:
          VITE_API_URL: http://localhost:8000/api
