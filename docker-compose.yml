# Jalankan seluruh sistem:  docker compose up --build
#   Frontend : http://localhost:8080
#   Backend  : http://localhost:8000/api
# Akun demo (di-seed otomatis): test@example.com / password

services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-notes}
      MYSQL_USER: ${MYSQL_USER:-notes}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-notes_secret}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_secret}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - app-net

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: notes-backend:local
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_KEY: ${DOCKER_APP_KEY:-}
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${MYSQL_DATABASE:-notes}
      DB_USERNAME: ${MYSQL_USER:-notes}
      DB_PASSWORD: ${MYSQL_PASSWORD:-notes_secret}
      DB_SEED: "true"
      CORS_ALLOWED_ORIGINS: http://localhost:8080,http://127.0.0.1:8080
    ports:
      - "8000:8000"
    networks:
      - app-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Dipanggil dari browser -> pakai port yang di-publish backend ke host
        VITE_API_URL: ${VITE_API_URL_DOCKER:-http://localhost:8000/api}
    image: notes-frontend:local
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:8080"
    networks:
      - app-net

networks:
  app-net:
    driver: bridge

volumes:
  db_data:
